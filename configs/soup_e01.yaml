# PeruCompras AI
# Experimento E01 - Fine-Tuning exploratorio

base: Qwen/Qwen3-8B
task: sft

data:
  train: ./data/sft/pilot/train.jsonl
  format: alpaca
  val_split: 0.1
  max_length: 1024

training:
  epochs: 1
  lr: 0.00002
  batch_size: 1

  lora:
    r: 8
    alpha: 16

  quantization: 4bit

  # Experimental: reduce uso de VRAM
  stream_layers: true
  stream_source: auto

output: ./artifacts/perucompras-qwen3-8b-e01
